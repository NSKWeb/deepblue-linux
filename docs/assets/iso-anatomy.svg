<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" role="img" aria-label="Anatomy of the DeepBlue hybrid ISO: partition scheme, boot records, isolinux and grub config, the live squashfs, the Debian installer tree and the signed APT archive, with a zoom into the squashfs contents">
  <defs>
    <linearGradient id="ia-hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a4a86"/><stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="ia-disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/><stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <marker id="ia-a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/>
    </marker>
    <style>
      .ia-t { font-family: Segoe UI, Helvetica, Arial, sans-serif; }
      .ia-h { font-size: 15px; font-weight: 700; fill: #0e7490; }
      .ia-p { font-size: 12px; fill: #475569; }
      .ia-d { font-size: 12.5px; fill: #0f172a; }
      .ia-m { font-family: Consolas, "Courier New", monospace; font-size: 11.5px; fill: #0e7490; }
      .ia-w { font-size: 12px; fill: #e0f2fe; }
      .ia-hw{ font-size: 13px; font-weight: 700; fill: #e0f2fe; }
    </style>
  </defs>

  <rect width="1240" height="800" fill="#f8fafc"/>
  <rect x="0" y="0" width="1240" height="64" fill="url(#ia-hdr)"/>
  <text x="30" y="42" class="ia-t" font-size="24" font-weight="700" fill="#f0f9ff">Anatomy of the ISO — one file, two boot paths, four payloads</text>
  <text x="1210" y="42" class="ia-t" font-size="15" fill="#bae6fd" text-anchor="end">1,997,537,280 bytes</text>

  <!-- ============ disc cross-section ============ -->
  <text x="30" y="100" class="ia-t ia-h">1 · On the disc — partition scheme</text>

  <!-- partition 1: isohybrid MBR gap / boot -->
  <g>
    <rect x="30" y="116" width="1180" height="92" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
    <!-- MBR -->
    <rect x="42" y="128" width="86" height="68" rx="8" fill="#0b2f52"/>
    <text x="85" y="156" class="ia-t ia-w" font-weight="700" text-anchor="middle">MBR</text>
    <text x="85" y="176" class="ia-t ia-w" font-size="10" text-anchor="middle" opacity="0.8">+ GPT</text>
    <text x="85" y="190" class="ia-t ia-w" font-size="10" text-anchor="middle" opacity="0.8">isohybrid</text>
    <!-- EFI -->
    <rect x="140" y="128" width="150" height="68" rx="8" fill="#0f2340" stroke="#7dd3fc"/>
    <text x="215" y="154" class="ia-t ia-w" font-weight="700" text-anchor="middle">efi.img</text>
    <text x="215" y="174" class="ia-t ia-w" font-size="10" text-anchor="middle" opacity="0.85">FAT · GRUB EFI</text>
    <text x="215" y="189" class="ia-t ia-w" font-size="10" text-anchor="middle" opacity="0.85">UEFI boot</text>
    <!-- isolinux -->
    <rect x="302" y="128" width="150" height="68" rx="8" fill="#0f2340" stroke="#7dd3fc"/>
    <text x="377" y="154" class="ia-t ia-w" font-weight="700" text-anchor="middle">isolinux/</text>
    <text x="377" y="174" class="ia-t ia-w" font-size="10" text-anchor="middle" opacity="0.85">BIOS boot</text>
    <text x="377" y="189" class="ia-t ia-w" font-size="10" text-anchor="middle" opacity="0.85">splash.png</text>
    <!-- live -->
    <rect x="464" y="128" width="330" height="68" rx="8" fill="#0f2340" stroke="#7dd3fc"/>
    <text x="629" y="154" class="ia-t ia-w" font-weight="700" text-anchor="middle">live/</text>
    <text x="629" y="174" class="ia-t ia-w" font-size="10" text-anchor="middle" opacity="0.85">vmlinuz · initrd.img</text>
    <text x="629" y="189" class="ia-t ia-w" font-size="10" text-anchor="middle" opacity="0.85">filesystem.squashfs (≈1.098 GiB)</text>
    <!-- installer -->
    <rect x="806" y="128" width="180" height="68" rx="8" fill="#0f2340" stroke="#7dd3fc"/>
    <text x="896" y="154" class="ia-t ia-w" font-weight="700" text-anchor="middle">install.*</text>
    <text x="896" y="174" class="ia-t ia-w" font-size="10" text-anchor="middle" opacity="0.85">installer kernel/initrd</text>
    <text x="896" y="189" class="ia-t ia-w" font-size="10" text-anchor="middle" opacity="0.85">udebs → /dists</text>
    <!-- archive -->
    <rect x="998" y="128" width="200" height="68" rx="8" fill="#0b3b2a" stroke="#86efac"/>
    <text x="1098" y="154" class="ia-t ia-w" font-weight="700" text-anchor="middle">deepblue repo</text>
    <text x="1098" y="174" class="ia-t ia-w" font-size="10" text-anchor="middle" opacity="0.9">signed APT archive</text>
    <text x="1098" y="189" class="ia-t ia-w" font-size="10" text-anchor="middle" opacity="0.9">dists/cobalt · pool/</text>
  </g>
  <text x="30" y="226" class="ia-t ia-p">El Torito hybrid layout: the same bytes boot on BIOS via <tspan class="ia-m">isolinux</tspan> and on UEFI via <tspan class="ia-m">efi.img</tspan>; volume label <tspan class="ia-m">DEEPBLUE</tspan>.</text>

  <!-- ============ boot config ============ -->
  <text x="30" y="272" class="ia-t ia-h">2 · Boot records — what each firmware reads</text>
  <g>
    <rect x="30" y="288" width="580" height="118" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
    <rect x="30" y="288" width="6" height="118" rx="3" fill="#0891b2"/>
    <text x="50" y="314" class="ia-t ia-d" font-weight="700">BIOS path — isolinux</text>
    <text x="50" y="338" class="ia-t ia-m">/isolinux/isolinux.cfg</text>
    <text x="50" y="360" class="ia-t ia-p">• Live system   → <tspan class="ia-m">boot=live components</tspan></text>
    <text x="50" y="380" class="ia-t ia-p">• Start installer → installer kernel + initrd</text>
    <text x="50" y="400" class="ia-t ia-p">• Failsafe      → conservative kernel options</text>
  </g>
  <g>
    <rect x="630" y="288" width="580" height="118" rx="12" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="630" y="288" width="6" height="118" rx="3" fill="#22c55e"/>
    <text x="650" y="314" class="ia-t ia-d" font-weight="700">UEFI path — GRUB</text>
    <text x="650" y="338" class="ia-t ia-m">/boot/grub/grub.cfg</text>
    <text x="650" y="360" class="ia-t ia-p">• same three entries, signed EFI binary</text>
    <text x="650" y="380" class="ia-t ia-p">• Secure Boot off is required (image is not SB-signed)</text>
    <text x="650" y="400" class="ia-t ia-p">• finds the squashfs by its on-disc path</text>
  </g>

  <path d="M620 406 V430" stroke="#0891b2" stroke-width="3" fill="none" marker-end="url(#ia-a)"/>

  <!-- ============ squashfs zoom ============ -->
  <text x="30" y="452" class="ia-t ia-h">3 · Inside <tspan class="ia-m">filesystem.squashfs</tspan> — the live root, read-only</text>
  <g>
    <rect x="30" y="468" width="1180" height="188" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <g>
      <rect x="52" y="492" width="212" height="142" rx="9" fill="#ffffff" stroke="#7dd3fc"/>
      <text x="68" y="516" class="ia-t ia-d" font-weight="700">/usr/share/deepblue/</text>
      <text x="68" y="540" class="ia-t ia-p">logo/deepblue-logo.png</text>
      <text x="68" y="560" class="ia-t ia-p">wallpaper.png</text>
      <text x="68" y="580" class="ia-t ia-p">repo/  ← signed archive</text>
      <text x="68" y="600" class="ia-t ia-p">keyring.gpg</text>
      <text x="68" y="620" class="ia-t ia-p">release</text>
    </g>
    <g>
      <rect x="282" y="492" width="212" height="142" rx="9" fill="#ffffff" stroke="#7dd3fc"/>
      <text x="298" y="516" class="ia-t ia-d" font-weight="700">/usr/share/</text>
      <text x="298" y="540" class="ia-t ia-p">Kvantum/DeepBlue</text>
      <text x="298" y="560" class="ia-t ia-p">lxqt/themes/DeepBlue</text>
      <text x="298" y="580" class="ia-t ia-p">plymouth/themes/deepblue</text>
      <text x="298" y="600" class="ia-t ia-p">themes/Arc-Dark</text>
      <text x="298" y="620" class="ia-t ia-p">icons/Papirus-Dark</text>
    </g>
    <g>
      <rect x="512" y="492" width="212" height="142" rx="9" fill="#ffffff" stroke="#7dd3fc"/>
      <text x="528" y="516" class="ia-t ia-d" font-weight="700">/etc/</text>
      <text x="528" y="540" class="ia-t ia-p">os-release → DeepBlue</text>
      <text x="528" y="560" class="ia-t ia-p">apt/sources.list.d/</text>
      <text x="528" y="580" class="ia-t ia-p">  deepblue.sources</text>
      <text x="528" y="600" class="ia-t ia-p">skel/  ← user defaults</text>
      <text x="528" y="620" class="ia-t ia-p">lightdm/lightdm.conf</text>
    </g>
    <g>
      <rect x="742" y="492" width="212" height="142" rx="9" fill="#ffffff" stroke="#7dd3fc"/>
      <text x="758" y="516" class="ia-t ia-d" font-weight="700">/home/deepblue/</text>
      <text x="758" y="540" class="ia-t ia-p">.config/lxqt</text>
      <text x="758" y="560" class="ia-t ia-p">.config/qt6ct</text>
      <text x="758" y="580" class="ia-t ia-p">.config/plank</text>
      <text x="758" y="600" class="ia-t ia-p">.gtkrc-2.0 / gtk-3.0</text>
      <text x="758" y="620" class="ia-t ia-p">Desktop/</text>
    </g>
    <g>
      <rect x="972" y="492" width="216" height="142" rx="9" fill="#ffffff" stroke="#7dd3fc"/>
      <text x="988" y="516" class="ia-t ia-d" font-weight="700">/ (system)</text>
      <text x="988" y="540" class="ia-t ia-p">usr/bin · usr/lib</text>
      <text x="988" y="560" class="ia-t ia-p">LXQt + Qt6 runtime</text>
      <text x="988" y="580" class="ia-t ia-p">systemd · apt · dpkg</text>
      <text x="988" y="600" class="ia-t ia-p">kernel modules</text>
      <text x="988" y="620" class="ia-t ia-p">(trimmed per the size pass)</text>
    </g>
  </g>
  <text x="30" y="678" class="ia-t ia-p">The squashfs is compressed read-only: at boot <tspan class="ia-m">live-boot</tspan> mounts it and overlays a RAM <tspan class="ia-m">tmpfs</tspan>, so the live system never writes to your disk.</text>

  <!-- ============ flow footer ============ -->
  <rect x="30" y="700" width="1180" height="82" rx="12" fill="#ffffff" stroke="#0a2e5b" stroke-width="1.5"/>
  <text x="50" y="726" class="ia-t ia-d" font-weight="700">Two payloads, one image</text>
  <text x="50" y="750" class="ia-t ia-p"><tspan font-weight="700" fill="#0e7490">Live system</tspan> — squashfs → LXQt desktop, identity from <tspan class="ia-m">deepblue-base</tspan>, archive ready for <tspan class="ia-m">apt update</tspan>.</text>
  <text x="50" y="770" class="ia-t ia-p"><tspan font-weight="700" fill="#15803d">Installer</tspan> — udebs + installer kernel write a persistent DeepBlue to disk, wired to the same signed archive.</text>
</svg>
