<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 840" width="1240" height="840" role="img" aria-label="DeepBlue session flow from firmware and boot menu, through the live boot chain (auto-login) and the installer chain (password login), into the LXQt session">
  <defs>
    <linearGradient id="sf-hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a4a86"/><stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <marker id="sf-a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
    <marker id="sf-g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/>
    </marker>
    <style>
      .sf-t { font-family: Segoe UI, Helvetica, Arial, sans-serif; }
      .sf-h { font-size: 16px; font-weight: 700; fill: #e0f2fe; }
      .sf-p { font-size: 12.5px; fill: #475569; }
      .sf-d { font-size: 13px; fill: #0f172a; }
      .sf-m { font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: #0e7490; }
      .sf-mg{ font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: #15803d; }
      .sf-lbl { font-size: 14px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1240" height="840" fill="#f8fafc"/>
  <rect x="0" y="0" width="1240" height="64" fill="url(#sf-hdr)"/>
  <text x="30" y="42" class="sf-t" font-size="24" font-weight="700" fill="#f0f9ff">Session flow — firmware → boot → desktop, and how login differs</text>
  <text x="1210" y="42" class="sf-t" font-size="15" fill="#bae6fd" text-anchor="end">BIOS + UEFI</text>

  <!-- firmware -->
  <rect x="380" y="88" width="480" height="56" rx="12" fill="#0b2f52" stroke="#1e6ea8" stroke-width="2"/>
  <text x="620" y="114" class="sf-t sf-h" text-anchor="middle">Firmware</text>
  <text x="620" y="133" class="sf-t" font-size="12.5" fill="#cbd5e1" text-anchor="middle">BIOS (isolinux)  ·  UEFI (grub / efi.img)  ·  El Torito hybrid</text>

  <path d="M620 144 V168" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#sf-a)"/>

  <!-- boot menu -->
  <rect x="380" y="170" width="480" height="86" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="398" y="196" class="sf-t sf-d" font-weight="700">Boot menu — DeepBlue</text>
  <text x="398" y="218" class="sf-t sf-p">• Live system  — full desktop, disk untouched</text>
  <text x="398" y="238" class="sf-t sf-p">• Start installer  — install DeepBlue to disk</text>

  <!-- branch arrows -->
  <path d="M560 256 C 460 280, 320 278, 320 300" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#sf-a)"/>
  <path d="M680 256 C 780 280, 920 278, 920 300" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#sf-a)"/>
  <text x="250" y="292" class="sf-t sf-lbl" fill="#0e7490">LIVE PATH</text>
  <text x="864" y="292" class="sf-t sf-lbl" fill="#15803d">INSTALL PATH</text>

  <!-- ================= LIVE COLUMN ================= -->
  <g>
    <rect x="40" y="304" width="560" height="56" rx="11" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
    <rect x="40" y="304" width="6" height="56" rx="3" fill="#0891b2"/>
    <text x="60" y="328" class="sf-t sf-d" font-weight="700">Kernel + initrd</text>
    <text x="60" y="347" class="sf-t sf-p">the ISO’s own <tspan class="sf-m">vmlinuz</tspan> / <tspan class="sf-m">initrd.img</tspan>, cmdline <tspan class="sf-m">boot=live components</tspan></text>
  </g>
  <path d="M320 360 V384" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#sf-a)"/>
  <g>
    <rect x="40" y="386" width="560" height="56" rx="11" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
    <rect x="40" y="386" width="6" height="56" rx="3" fill="#0891b2"/>
    <text x="60" y="410" class="sf-t sf-d" font-weight="700">live-boot → squashfs</text>
    <text x="60" y="429" class="sf-t sf-p">read-only root mounted from <tspan class="sf-m">filesystem.squashfs</tspan>; writes go to RAM (tmpfs)</text>
  </g>
  <path d="M320 442 V466" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#sf-a)"/>
  <g>
    <rect x="40" y="468" width="560" height="56" rx="11" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
    <rect x="40" y="468" width="6" height="56" rx="3" fill="#0891b2"/>
    <text x="60" y="492" class="sf-t sf-d" font-weight="700">systemd</text>
    <text x="60" y="511" class="sf-t sf-p">brings up services; identity already in place from <tspan class="sf-m">deepblue-base</tspan></text>
  </g>
  <path d="M320 524 V548" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#sf-a)"/>
  <g>
    <rect x="40" y="550" width="560" height="66" rx="11" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <rect x="40" y="550" width="6" height="66" rx="3" fill="#0891b2"/>
    <text x="60" y="574" class="sf-t sf-d" font-weight="700">LightDM + slick-greeter</text>
    <text x="60" y="593" class="sf-t sf-p">auto-login as <tspan class="sf-m">deepblue</tspan> — <tspan font-weight="700" fill="#0e7490">no password on the live session</tspan></text>
    <text x="60" y="610" class="sf-t sf-p">slick-greeter is themed, but skipped because autologin is on</text>
  </g>
  <path d="M320 616 V640" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#sf-a)"/>
  <g>
    <rect x="40" y="642" width="560" height="56" rx="11" fill="#0b2f52" stroke="#1e6ea8" stroke-width="2"/>
    <text x="320" y="666" class="sf-t sf-h" text-anchor="middle">LXQt desktop (live)</text>
    <text x="320" y="685" class="sf-t" font-size="12.5" fill="#cbd5e1" text-anchor="middle">panel · Plank dock · Kvantum windows · DeepBlue wallpaper</text>
  </g>

  <!-- ================= INSTALL COLUMN ================= -->
  <g>
    <rect x="640" y="304" width="560" height="56" rx="11" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="640" y="304" width="6" height="56" rx="3" fill="#22c55e"/>
    <text x="660" y="328" class="sf-t sf-d" font-weight="700">debian-installer</text>
    <text x="660" y="347" class="sf-t sf-p">graphical or textual; udebs shipped under <tspan class="sf-mg">/dists</tspan></text>
  </g>
  <path d="M920 360 V384" stroke="#22c55e" stroke-width="3" fill="none" marker-end="url(#sf-g)"/>
  <g>
    <rect x="640" y="386" width="560" height="56" rx="11" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="640" y="386" width="6" height="56" rx="3" fill="#22c55e"/>
    <text x="660" y="410" class="sf-t sf-d" font-weight="700">Partition + install to disk</text>
    <text x="660" y="429" class="sf-t sf-p">unpacks the same live system onto the target disk, sets up GRUB</text>
  </g>
  <path d="M920 442 V466" stroke="#22c55e" stroke-width="3" fill="none" marker-end="url(#sf-g)"/>
  <g>
    <rect x="640" y="468" width="560" height="56" rx="11" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="640" y="468" width="6" height="56" rx="3" fill="#22c55e"/>
    <text x="660" y="492" class="sf-t sf-d" font-weight="700">GRUB → kernel → systemd</text>
    <text x="660" y="511" class="sf-t sf-p">on every later boot; <tspan class="sf-mg">deepblue-base</tspan> diversions keep the identity</text>
  </g>
  <path d="M920 524 V548" stroke="#22c55e" stroke-width="3" fill="none" marker-end="url(#sf-g)"/>
  <g>
    <rect x="640" y="550" width="560" height="66" rx="11" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <rect x="640" y="550" width="6" height="66" rx="3" fill="#22c55e"/>
    <text x="660" y="574" class="sf-t sf-d" font-weight="700">LightDM + slick-greeter</text>
    <text x="660" y="593" class="sf-t sf-p"><tspan font-weight="700" fill="#15803d">password login</tspan> — you choose the user at install time</text>
    <text x="660" y="610" class="sf-t sf-p">autologin is not configured on the installed system</text>
  </g>
  <path d="M920 616 V640" stroke="#22c55e" stroke-width="3" fill="none" marker-end="url(#sf-g)"/>
  <g>
    <rect x="640" y="642" width="560" height="56" rx="11" fill="#0b2f52" stroke="#1e6ea8" stroke-width="2"/>
    <text x="920" y="666" class="sf-t sf-h" text-anchor="middle">LXQt desktop (installed)</text>
    <text x="920" y="685" class="sf-t" font-size="12.5" fill="#cbd5e1" text-anchor="middle">same look, now persistent — updates from DeepBlue Linux:cobalt</text>
  </g>

  <!-- ================= login explainer ================= -->
  <rect x="40" y="716" width="1160" height="106" rx="12" fill="#ffffff" stroke="#1c6fd6" stroke-width="2"/>
  <text x="60" y="744" class="sf-t" font-size="15" font-weight="700" fill="#0e7490">Login, the honest picture</text>
  <g class="sf-t">
    <text x="60" y="770" class="sf-d"><tspan font-weight="700">Live session</tspan> — <tspan class="sf-m">deepblue</tspan> / <tspan class="sf-m">live</tspan>, auto-logged-in. Convenience for a USB try-out; nothing on disk is touched.</text>
    <text x="60" y="792" class="sf-d"><tspan font-weight="700">Installed system</tspan> — your own user, a real password, entered at the greeter. There is no passwordless login on an installed DeepBlue.</text>
    <text x="60" y="812" class="sf-p">The live password is documented on purpose (it is a throwaway session), and the live user is in <tspan class="sf-m">sudo</tspan> only for that session.</text>
  </g>
</svg>
