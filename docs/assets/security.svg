<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900" role="img" aria-label="DeepBlue Linux defence-in-depth: five hardening layers from signed packages to disk encryption, the package trust chain, the enabled controls, and the honest remaining gaps">
  <defs>
    <linearGradient id="se-hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a4a86"/><stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="se-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490"/><stop offset="100%" stop-color="#0a2e5b"/>
    </linearGradient>
    <marker id="se-a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
    <marker id="se-g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/>
    </marker>
    <style>
      .se-t { font-family: Segoe UI, Helvetica, Arial, sans-serif; }
      .se-h { font-size: 15px; font-weight: 700; fill: #0e7490; }
      .se-p { font-size: 12px; fill: #475569; }
      .se-d { font-size: 12.5px; fill: #0f172a; }
      .se-m { font-family: Consolas, "Courier New", monospace; font-size: 11.5px; fill: #0e7490; }
      .se-mg{ font-family: Consolas, "Courier New", monospace; font-size: 11.5px; fill: #15803d; }
      .se-w { font-size: 12px; fill: #e0f2fe; }
    </style>
  </defs>

  <rect width="1240" height="900" fill="#f8fafc"/>
  <rect x="0" y="0" width="1240" height="64" fill="url(#se-hdr)"/>
  <text x="30" y="42" class="se-t" font-size="24" font-weight="700" fill="#f0f9ff">Security — defence in depth</text>
  <text x="1210" y="42" class="se-t" font-size="15" fill="#bae6fd" text-anchor="end">DeepBlue Linux 1.0 (Cobalt)</text>

  <!-- ============ LEFT: five layers ============ -->
  <text x="30" y="100" class="se-t se-h">1 · Five layers between an attacker and your data</text>

  <!-- shield outline -->
  <path d="M40 128 h300 a10 10 0 0 1 10 10 v210 a10 10 0 0 1 -10 10 h-300 a10 10 0 0 1 -10 -10 v-210 a10 10 0 0 1 10 -10 Z" fill="none" stroke="none"/>
  <g>
    <rect x="30" y="120" width="330" height="60" rx="10" fill="#0b2f52" stroke="#1e6ea8"/>
    <text x="48" y="145" class="se-t se-w" font-weight="700">1 · Signed packages</text>
    <text x="48" y="165" class="se-t se-w" font-size="11.5" opacity="0.88">apt rejects anything not signed by the DeepBlue key</text>
  </g>
  <g>
    <rect x="30" y="190" width="330" height="60" rx="10" fill="#0e7490" stroke="#38bdf8"/>
    <text x="48" y="215" class="se-t se-w" font-weight="700">2 · Secure Boot</text>
    <text x="48" y="235" class="se-t se-w" font-size="11.5" opacity="0.9">shim + MOK chain — firmware refuses unsigned kernels</text>
  </g>
  <g>
    <rect x="30" y="260" width="330" height="60" rx="10" fill="#0891b2" stroke="#7dd3fc"/>
    <text x="48" y="285" class="se-t se-w" font-weight="700">3 · Firewall + AppArmor</text>
    <text x="48" y="305" class="se-t se-w" font-size="11.5" opacity="0.92">default-deny inbound; per-app confinement</text>
  </g>
  <g>
    <rect x="30" y="330" width="330" height="60" rx="10" fill="#22c55e" stroke="#86efac"/>
    <text x="48" y="355" class="se-t se-w" font-weight="700">4 · Timely updates</text>
    <text x="48" y="375" class="se-t se-w" font-size="11.5" opacity="0.92">unattended-upgrades applies security fixes daily</text>
  </g>
  <g>
    <rect x="30" y="400" width="330" height="60" rx="10" fill="#15803d" stroke="#4ade80"/>
    <text x="48" y="425" class="se-t se-w" font-weight="700">5 · Disk encryption</text>
    <text x="48" y="445" class="se-t se-w" font-size="11.5" opacity="0.92">LUKS2 — data unreadable if the machine is stolen</text>
  </g>

  <text x="30" y="495" class="se-t se-p">Each layer assumes the ones below it can fail. No single control is trusted alone.</text>

  <!-- ============ RIGHT TOP: package trust chain ============ -->
  <text x="410" y="100" class="se-t se-h">2 · The package trust chain</text>
  <rect x="410" y="116" width="800" height="180" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>

  <g>
    <rect x="432" y="150" width="150" height="72" rx="9" fill="#ecfeff" stroke="#7dd3fc"/>
    <text x="507" y="178" class="se-t se-d" font-weight="700" text-anchor="middle">source</text>
    <text x="507" y="198" class="se-t se-m" text-anchor="middle">pkg/deepblue-base</text>
  </g>
  <g>
    <rect x="612" y="150" width="150" height="72" rx="9" fill="#ecfeff" stroke="#7dd3fc"/>
    <text x="687" y="178" class="se-t se-d" font-weight="700" text-anchor="middle">build</text>
    <text x="687" y="198" class="se-t se-m" text-anchor="middle">dpkg-deb --build</text>
  </g>
  <g>
    <rect x="792" y="150" width="150" height="72" rx="9" fill="#fefce8" stroke="#fde047"/>
    <text x="867" y="178" class="se-t se-d" font-weight="700" text-anchor="middle">sign</text>
    <text x="867" y="198" class="se-t se-m" text-anchor="middle">reprepro · GPG</text>
  </g>
  <g>
    <rect x="972" y="150" width="216" height="72" rx="9" fill="#f0fdf4" stroke="#86efac"/>
    <text x="1080" y="178" class="se-t se-d" font-weight="700" text-anchor="middle">trusted install</text>
    <text x="1080" y="198" class="se-t se-mg" text-anchor="middle">apt install ✓</text>
  </g>
  <line x1="582" y1="186" x2="608" y2="186" stroke="#38bdf8" stroke-width="2" marker-end="url(#se-a)"/>
  <line x1="762" y1="186" x2="788" y2="186" stroke="#38bdf8" stroke-width="2" marker-end="url(#se-a)"/>
  <line x1="942" y1="186" x2="968" y2="186" stroke="#22c55e" stroke-width="2" marker-end="url(#se-g)"/>
  <text x="432" y="252" class="se-t se-p">Private key lives in <tspan class="se-m">repo/gnupg/</tspan> — gitignored, never shipped.</text>
  <text x="432" y="272" class="se-t se-p">The ISO carries only the <tspan class="se-m">public</tspan> keyring, so a stolen ISO cannot sign.</text>

  <!-- ============ RIGHT MID: enabled controls grid ============ -->
  <text x="410" y="330" class="se-t se-h">3 · What the installer sets up for you</text>
  <rect x="410" y="346" width="800" height="220" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>

  <g>
    <rect x="432" y="368" width="370" height="84" rx="9" fill="#f0fdf4" stroke="#86efac"/>
    <text x="450" y="392" class="se-t se-d" font-weight="700">nftables — default-deny inbound</text>
    <text x="450" y="412" class="se-t se-mg">policy drop; loopback + established allowed</text>
    <text x="450" y="432" class="se-t se-p">ssh/80/443 open only if you ask for them</text>
  </g>
  <g>
    <rect x="820" y="368" width="368" height="84" rx="9" fill="#f0fdf4" stroke="#86efac"/>
    <text x="838" y="392" class="se-t se-d" font-weight="700">unattended-upgrades</text>
    <text x="838" y="412" class="se-t se-mg">daily; security pocket only, no auto-reboot</text>
    <text x="838" y="432" class="se-t se-p">kernel/glibc fixes land without you watching</text>
  </g>
  <g>
    <rect x="432" y="462" width="370" height="84" rx="9" fill="#f0fdf4" stroke="#86efac"/>
    <text x="450" y="486" class="se-t se-d" font-weight="700">LUKS2 full-disk encryption</text>
    <text x="450" y="506" class="se-t se-mg">crypto selected by default in the installer</text>
    <text x="450" y="526" class="se-t se-p">passphrase is never preseeded — you type it</text>
  </g>
  <g>
    <rect x="820" y="462" width="368" height="84" rx="9" fill="#fefce8" stroke="#fde047"/>
    <text x="838" y="486" class="se-t se-d" font-weight="700">AppArmor + sysctl hardening</text>
    <text x="838" y="506" class="se-t se-mg">kernel.dmesg_restrict, kptr_restrict, no IP forward</text>
    <text x="838" y="526" class="se-t se-p">confines services; shrinks kernel info leaks</text>
  </g>

  <!-- ============ RIGHT BOTTOM: honest gaps ============ -->
  <text x="410" y="612" class="se-t se-h">4 · The honest gaps</text>
  <rect x="410" y="628" width="800" height="238" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>

  <text x="432" y="656" class="se-t se-d" font-weight="700">Known limitations — stated plainly, not hidden</text>
  <circle cx="442" cy="682" r="4" fill="#ea580c"/>
  <text x="456" y="687" class="se-t se-p">Secure Boot is on, but the chain ends in Debian's key — a self-built kernel needs a MOK.</text>
  <circle cx="442" cy="708" r="4" fill="#ea580c"/>
  <text x="456" y="713" class="se-t se-p">LUKS passphrase can be lost — there is no recovery key unless you make one.</text>
  <circle cx="442" cy="734" r="4" fill="#ea580c"/>
  <text x="456" y="739" class="se-t se-p">The live session auto-logs in (password <tspan class="se-m">live</tspan>) and can <tspan class="se-m">sudo</tspan>; physical access = full access, as on every live distro.</text>
  <circle cx="442" cy="760" r="4" fill="#ea580c"/>
  <text x="456" y="765" class="se-t se-p">Firewall and AppArmor are on the installed system, not the throwaway live session.</text>
  <circle cx="442" cy="786" r="4" fill="#ea580c"/>
  <text x="456" y="791" class="se-t se-p">No remote attestation or TPM sealing yet — that is future work, not a shipped guarantee.</text>

  <text x="432" y="838" class="se-t se-p">An installed DeepBlue always asks for your own password at the greeter. The live session never does.</text>
</svg>
