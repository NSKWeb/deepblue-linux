# DeepBlue Linux — Debian installer preseeding.
#
# This file is loaded by the installer that ships on the ISO (live-build reads
# config/includes.installer/preseed.cfg). It changes the *defaults* the
# installer presents; it does not take choices away from you.
#
# The one security decision made here: disk encryption is preselected, so a
# machine that is stolen is not readable. The passphrase is deliberately NOT
# preseeded — you are asked for it, and only you know it.

# --- Localisation ---------------------------------------------------------
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# --- Network --------------------------------------------------------------
# Let the installer configure networking normally (DHCP is the common case).
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string deepblue
d-i netcfg/get_domain string localdomain

# --- Mirror ---------------------------------------------------------------
# Use a Debian mirror; the DeepBlue archive is added on the installed system
# by the deepblue-base package, not by the installer.
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# --- Clock ----------------------------------------------------------------
d-i clock-setup/utc boolean true
d-i time/zone string UTC

# --- Accounts -------------------------------------------------------------
# No root login; the first user is created with sudo, matching the live model.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true

# --- Partitioning: full-disk encryption by default ------------------------
# method "crypto" makes guided partitioning create an encrypted LUKS2 volume
# (with LVM inside) rather than a plain one. This is the security default.
d-i partman-auto/method string crypto
d-i partman-auto/choose_recipe select atomic

# If a previous install is found, replace it rather than dropping to manual.
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-md/confirm boolean true

# Confirm the guided encrypted layout without a second prompt.
d-i partman-auto/init_automatically_partition select Guided - use entire disk and set up encrypted LVM
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# The passphrase itself is NOT set here. The installer asks for it.
# (An unattended install could preseed passwd/user-password, but a preseeded
# disk passphrase is stored in plaintext on the ISO — never do that here.)

# --- Package selection ----------------------------------------------------
# No desktop task: DeepBlue's own desktop (LXQt + Kvantum) is installed from
# the live system's package set, so tasksel would only duplicate it.
tasksel tasksel/first multiselect
d-i pkgsel/include string deepblue-base deepblue-security
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# --- Boot loader ----------------------------------------------------------
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# --- Finish ---------------------------------------------------------------
d-i finish-install/reboot_in_progress note
