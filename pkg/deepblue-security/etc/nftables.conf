#!/usr/sbin/nft -f
# DeepBlue Linux default-deny firewall.
#
# This file is documentation as much as configuration: it is small enough to
# read in one sitting, which is the point. nftables.service loads it on every
# boot (deepblue-security enables that unit). Everything not explicitly
# allowed below is dropped.
#
# deepblue-security diverts nftables' own /etc/nftables.conf to
# /etc/nftables.conf.nftables so this file owns the firewall policy, exactly
# as deepblue-base diverts base-files' /etc/os-release. A Debian upgrade of
# the nftables package will not silently restore the permissive default.

flush ruleset

table inet filter {
	# --- input: anything arriving at this machine -------------------------
	chain input {
		type filter hook input priority filter; policy drop;

		# Loopback must always work; blocking it breaks X11, D-Bus, etc.
		iif lo accept

		# Replies to connections we opened, and packets tied to an existing
		# flow, are trusted. This is what makes a strict default-deny policy
		# usable on a desktop.
		ct state established,related accept

		# ICMP is not optional: path-MTU discovery needs it, and dropping it
		# makes the network break in confusing ways.
		ip protocol icmp accept
		ip6 nexthdr icmpv6 accept

		# --- Optional services --------------------------------------------
		# Uncomment what you actually run. Nothing is open by default, which
		# is the whole point of a default-deny policy.
		#
		# SSH, only if you run a server:
		#   tcp dport 22 accept
		#
		# mDNS / Avahi discovery on a trusted LAN:
		#   udp dport 5353 accept
		#
		# A web server:
		#   tcp dport { 80, 443 } accept

		# Everything else is dropped by the policy on this chain.
	}

	# --- forward: this machine is not a router ----------------------------
	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	# --- output: unrestricted; a desktop initiates what it wants ----------
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
