# DeepBlue Linux kernel hardening.
#
# Conservative, desktop-safe settings only. Nothing here breaks a normal
# session; each line closes an information leak or a classic attack surface.
# Applied at boot by systemd-sysctl.service. Verify with `sysctl --system`.

# --- Kernel information leaks ---------------------------------------------
# Only root may read the kernel ring buffer. Without this, unprivileged users
# can read addresses and driver chatter that help an exploit.
kernel.dmesg_restrict = 1

# Hide kernel pointers in /proc and printk output, so an attacker cannot
# defeat KASLR by reading an address out of /proc/kallsyms.
kernel.kptr_restrict = 2

# Restrict the perf_event subsystem to root. It has a long history of being
# usable for side-channel and privilege-escalation work.
kernel.perf_event_paranoid = 3

# Restrict unprivileged eBPF. It is a powerful primitive if abused.
kernel.unprivileged_bpf_disabled = 1

# --- Classic attack surfaces ----------------------------------------------
# Do not forward traffic; this is a workstation, not a router. Mirrors the
# nftables forward policy in /etc/nftables.conf.
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# Ignore ICMP redirects — they can be used to rewrite our routing table.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0

# Do not send redirects either; again, not a router.
net.ipv4.conf.all.send_redirects = 0

# Enable source-address verification (reverse-path filtering).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# --- Other hardening ------------------------------------------------------
# Restrict the kernel's magic SysRq to the safe subset.
kernel.sysrq = 176

# Raise the default ASLR entropy for mmap.
vm.mmap_rnd_bits = 32

# Restrict unprivileged user namespaces, a frequent container-escape vector,
# while leaving them available to programs that drop privileges first.
kernel.unprivileged_userns_clone = 0
